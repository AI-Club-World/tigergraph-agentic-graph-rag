name: CI

# ARCHITECTURE-SPEC, "Engineering guards": main is protected and always green. Backend pytest + ruff,
# frontend build + tests, and the two guard checks that exist specifically
# because assistants write this code.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: backend (pytest + ruff)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests
      - name: Test
        run: pytest -q

  frontend:
    name: frontend (build + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - name: Skip when the frontend module is absent on this branch
        id: check
        run: |
          if [ -f package.json ]; then echo "present=true" >> "$GITHUB_OUTPUT";
          else echo "present=false" >> "$GITHUB_OUTPUT"; fi
        working-directory: .
      - uses: actions/setup-node@v4
        if: steps.check.outputs.present == 'true'
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - if: steps.check.outputs.present == 'true'
        run: npm ci
      - if: steps.check.outputs.present == 'true'
        run: npm run lint
      - if: steps.check.outputs.present == 'true'
        run: npm run build
      - if: steps.check.outputs.present == 'true'
        run: npm test

  guards:
    name: guard checks (holdout, no-test-modified)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Guard 1 — the hidden set is opened by the batch runner and nothing else.
      # A single accidental read during development invalidates the holdout,
      # and it leaves no other trace.
      # Scoped to source, not prose: the specs and this audit discuss the
      # holdout by name, which is fine. Opening it from code is not.
      - name: Holdout grep
        run: |
          bad=$(grep -rl "acceptance/holdout" backend/src backend/tests frontend/src 2>/dev/null \
                | grep -v '^backend/src/ogr/eval/batch_runner\.py$' || true)
          if [ -n "$bad" ]; then
            echo "::error::Only backend/src/ogr/eval/batch_runner.py may reference acceptance/holdout. Offenders:"
            echo "$bad"
            exit 1
          fi
          echo "Holdout guard passed."

      # Guard 2 — a test edited alongside source in the same commit is how a
      # benchmark number is silently invalidated. Requires an explicit
      # TEST-CHANGE: marker in the commit message to allow it.
      - name: No-test-modified
        if: github.event_name == 'pull_request'
        run: |
          base="origin/${{ github.base_ref }}"
          git fetch origin "${{ github.base_ref }}" --depth=1 || true
          changed=$(git diff --name-only "$base"...HEAD || true)
          tests=$(echo "$changed" | grep -E "^backend/tests/" || true)
          src=$(echo "$changed" | grep -E "^backend/src/" || true)
          if [ -n "$tests" ] && [ -n "$src" ]; then
            if git log "$base"..HEAD --format=%B | grep -q "TEST-CHANGE:"; then
              echo "Test + source changed together, with a TEST-CHANGE: reason. Allowed."
            else
              echo "::error::This PR changes backend/tests/ and backend/src/ together."
              echo "If that is intended, add 'TEST-CHANGE: <reason>' to a commit message."
              exit 1
            fi
          fi
          echo "No-test-modified guard passed."
